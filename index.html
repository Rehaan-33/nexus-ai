<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS | Core Intelligence</title>
    <style>
        :root { 
            --nexus-red: #ff0033; 
            --nexus-black: #050505; 
            --accent: var(--nexus-red); 
            --border: rgba(255, 0, 51, 0.3); 
            --bg-glass: rgba(255, 255, 255, 0.03);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--nexus-black); 
            color: #fff; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        @keyframes heartbeat { 
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px var(--accent)); } 
            50% { transform: scale(1.08); filter: drop-shadow(0 0 15px var(--accent)); } 
        }
        #nexus-nav { 
            background: #0d0d0d; 
            border-bottom: 3px solid var(--accent); 
            padding: 15px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 10;
        }
        .nexus-logo { width: 45px; height: 45px; animation: heartbeat 3s infinite; }
        #core-container { flex: 1; display: flex; overflow: hidden; position: relative; }
        #sidebar { 
            width: 300px; background: #080808; border-right: 1px solid var(--border); 
            padding: 25px; display: flex; flex-direction: column; gap: 20px; z-index: 6;
        }
        .module { 
            background: #000; border: 1px solid var(--border); padding: 15px; 
            border-left: 4px solid var(--accent);
        }
        .label { font-size: 10px; color: var(--accent); font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        #chat-viewport { flex: 1; display: flex; flex-direction: column; padding: 20px; background: #050505; z-index: 6; }
        #chat-window { 
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; 
            gap: 15px; border: 1px solid var(--border); border-radius: 8px; 
            margin-bottom: 20px; background: var(--bg-glass); scroll-behavior: smooth;
        }
        .msg { max-width: 85%; padding: 12px 18px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
        .user { align-self: flex-end; background: var(--accent); color: white; }
        .bot { align-self: flex-start; background: #1a1a1a; border-left: 3px solid var(--accent); }
        #input-area { display: flex; gap: 10px; padding: 10px 20px; background: #0d0d0d; border-radius: 30px; border: 1px solid #222; }
        input { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 14px; }
        button { 
            background: var(--accent); border: none; color: white; padding: 8px 20px; 
            border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 11px; 
            text-transform: uppercase;
        }
        button:disabled { opacity: 0.4; }
    </style>
</head>
<body>
    <nav id="nexus-nav">
        <div style="display:flex; align-items:center; gap:15px;">
            <svg class="nexus-logo" viewBox="0 0 100 100"><path d="M35 75 L35 25 L65 75 L65 25" fill="none" stroke="#ff0033" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <h1 style="letter-spacing:10px; text-transform:uppercase; font-size: 1.5rem;">Nexus</h1>
        </div>
        <div id="uplink-status" style="font-size: 10px; color: #444; font-weight: bold;">UPLINK: LOCKED</div>
    </nav>
    <div id="core-container">
        <aside id="sidebar">
            <div class="module">
                <span class="label">System Clock</span>
                <div id="clock" style="text-align:center; font-family:monospace; font-size:1.2rem; margin-top:5px; color: var(--accent);">00:00:00</div>
            </div>
            <div class="module">
                <span class="label">Neural Uplink</span>
                <input type="password" id="keyInput" placeholder="OpenRouter Key..." style="width:100%; background:#111; border:1px solid #333; color:#fff; padding:8px; font-size:10px; margin-top: 8px;">
                <span class="label" style="display:block; margin-top:10px;">Clearance Code</span>
                <input type="password" id="passCode" placeholder="Enter Code..." style="width:100%; background:#111; border:1px solid #333; color:#fff; padding:8px; font-size:10px; margin-top: 5px;">
                <button id="saveKey" style="width:100%; margin-top:10px;">AUTHORIZE</button>
            </div>
        </aside>
        <main id="chat-viewport">
            <div id="chat-window">
                <div class="msg bot">Nexus Core secured. Provide API key and Clearance Code to establish uplink.</div>
            </div>
            <div id="input-area">
                <input type="text" id="userInput" placeholder="Initialize command..." autocomplete="off">
                <button id="sendBtn">SEND</button>
            </div>
        </main>
    </div>
    <script>
        let API_KEY = "";
        let AUTHENTICATED = false;
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);

        document.getElementById('saveKey').onclick = () => {
            const key = document.getElementById('keyInput').value.trim();
            const pass = document.getElementById('passCode').value.trim();
            if(pass === "20c" && key) {
                API_KEY = key;
                AUTHENTICATED = true;
                document.getElementById('uplink-status').innerText = "UPLINK: ACTIVE";
                document.getElementById('uplink-status').style.color = "var(--nexus-red)";
                alert("ACCESS GRANTED.");
            } else {
                alert("ACCESS DENIED: Invalid Code or Key.");
            }
        };

        async function run() {
            const input = document.getElementById('userInput').value;
            if(!input || !AUTHENTICATED) return;
            const chat = document.getElementById('chat-window');
            const u = document.createElement('div'); u.className='msg user'; u.innerText=input; chat.appendChild(u);
            document.getElementById('userInput').value='';
            const b = document.createElement('div'); b.className='msg bot'; b.innerText='Processing...'; chat.appendChild(b);
            try {
                const r = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method:"POST", headers:{"Authorization":`Bearer ${API_KEY}`,"Content-Type":"application/json"},
                    body:JSON.stringify({"model":"google/gemma-7b-it:free","messages":[{"role":"user","content":input}]})
                });
                const d = await r.json();
                b.innerText = d.choices[0].message.content;
            } catch(e) { b.innerText = "Error: Handshake Failed."; }
            chat.scrollTop = chat.scrollHeight;
        }
        document.getElementById('sendBtn').onclick = run;
    </script>
</body>
</html>
