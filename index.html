<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXUS | Strategic Hub</title>
    <style>
        :root { --nexus-red: #ff0033; --nexus-black: #050505; --accent: var(--nexus-red); --border: rgba(255, 0, 51, 0.4); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--nexus-black); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #nexus-nav { background: #0d0d0d; border-bottom: 3px solid var(--accent); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .heartbeat { width: 12px; height: 12px; background: var(--accent); border-radius: 50%; display: inline-block; margin-right: 10px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 10px var(--accent); } 100% { transform: scale(0.9); opacity: 0.7; } }
        #sidebar { width: 300px; background: #080808; border-right: 1px solid var(--border); padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        .module { background: #000; border: 1px solid var(--border); padding: 15px; border-left: 4px solid var(--accent); }
        .label { font-size: 10px; color: var(--accent); font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; border: 1px solid var(--border); margin: 20px; background: rgba(255,0,51,0.02); }
        .msg { max-width: 85%; padding: 14px; border-radius: 4px; font-size: 14px; line-height: 1.6; }
        .user { align-self: flex-end; background: var(--accent); color: white; }
        .bot { align-self: flex-start; background: #1a1a1a; border-left: 3px solid var(--accent); font-family: 'Consolas', monospace; }
        input { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 10px; margin-top: 5px; outline: none; }
        button { background: var(--accent); border: none; color: white; padding: 12px; cursor: pointer; font-weight: 900; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <nav id="nexus-nav">
        <div style="display:flex; align-items:center;">
            <div class="heartbeat"></div>
            <h1 style="letter-spacing:10px; text-transform:uppercase;">Nexus</h1>
        </div>
        <div id="status" style="font-size: 10px; color: #555;">UPLINK: LOCKED</div>
    </nav>
    <div style="display:flex; flex:1; overflow:hidden;">
        <aside id="sidebar">
            <div class="module">
                <span class="label">Neural Uplink</span>
                <input type="password" id="keyInput" placeholder="API Key (sk-or-...)">
                <input type="password" id="passInput" placeholder="Clearance (20c)" style="margin-top:10px;">
                <button id="authBtn">AUTHORIZE</button>
            </div>
        </aside>
        <main style="flex:1; display:flex; flex-direction:column;">
            <div id="chat-window"><div class="msg bot">NEXUS core secured. Enter credentials.</div></div>
            <div style="padding: 0 20px 20px; display: flex; gap: 10px;">
                <input type="text" id="userInput" placeholder="Initialize command..." style="flex:1;">
                <button id="sendBtn" style="width:100px;">SEND</button>
            </div>
        </main>
    </div>
    <script>
        let KEY = ""; let OK = false;
        document.getElementById('authBtn').onclick = () => {
            const k = document.getElementById('keyInput').value; const p = document.getElementById('passInput').value;
            if(p === '20c' && k.startsWith('sk-or-')) { 
                KEY=k; OK=true; 
                document.getElementById('status').innerText="UPLINK: ACTIVE"; document.getElementById('status').style.color="red";
                alert("NEXUS ACCESS GRANTED");
            } else { alert("ACCESS DENIED"); }
        };
        async function send() {
            if(!OK) return; const val = document.getElementById('userInput').value; if(!val) return;
            const chat = document.getElementById('chat-window');
            const u = document.createElement('div'); u.className='msg user'; u.innerText=val; chat.appendChild(u);
            const b = document.createElement('div'); b.className='msg bot'; b.innerText='...'; chat.appendChild(b);
            document.getElementById('userInput').value='';
            try {
                const r = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method:"POST", headers:{"Authorization":`Bearer ${KEY}`,"Content-Type":"application/json"},
                    body:JSON.stringify({"model":"google/gemini-2.0-flash-lite-preview-02-05:free","messages":[{"role":"user","content":val}]})
                });
                const d = await r.json(); b.innerText = d.choices[0].message.content;
            } catch(e) { b.innerText = "UPLINK ERROR: HANDSHAKE FAILED"; }
            chat.scrollTop = chat.scrollHeight;
        }
        document.getElementById('sendBtn').onclick = send;
    </script>
</body>
</html>
