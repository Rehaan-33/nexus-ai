<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>NEXUS | Core Intelligence</title>
    <style>
        :root { --accent: #00f2ff; --bg: #020202; --border: rgba(0, 242, 255, 0.2); }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        nav { background: #080808; border-bottom: 2px solid var(--accent); padding: 15px; display: flex; justify-content: space-between; }
        #container { display: flex; flex: 1; }
        aside { width: 250px; background: #050505; border-right: 1px solid var(--border); padding: 20px; }
        .module { background: #000; border: 1px solid var(--border); padding: 10px; border-top: 2px solid var(--accent); }
        .label { font-size: 10px; color: var(--accent); text-transform: uppercase; }
        input, button { width: 100%; background: #111; border: 1px solid var(--accent); color: white; padding: 5px; margin-top: 5px; }
        button { background: var(--accent); color: #000; cursor: pointer; }
    </style>
</head>
<body>
    <nav><h1>NEXUS</h1></nav>
    <div id="container">
        <aside>
            <div class="module">
                <div class="label">API Key</div>
                <input type="password" id="keyInput">
                <div class="label" style="margin-top:10px;">Clearance Code (20c)</div>
                <input type="password" id="sidePass">
                <button>SUBMIT</button>
            </div>
        </aside>
    </div>
</body>
</html>
